<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc">
  <title id="title">작업 하나가 진행되는 흐름</title>
  <desc id="desc">메인 Codex가 단계를 등록하면 비AI 상주 실행기가 정원과 체크포인트를 확인하고 참가자 모델을 적용한다. 단계별 Moderator가 워커에게 위임하고 결과와 수정을 취합한다. 실행기는 최종 완료 표식, 그룹 idle, 필수 파일을 확인하고 다음 등록 단계를 시작한다. 활동 지도는 작업 전달에 참여하지 않고 그룹 기록과 실행기 이벤트를 별도로 읽는다.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
      .title { fill: #f4f7ff; font-size: 30px; font-weight: 700; }
      .name { fill: #f3f7ff; font-size: 21px; font-weight: 600; }
      .label { fill: #d5e1f2; font-size: 19px; }
      .muted { fill: #adbed8; font-size: 18px; }
      .node { fill: #18263c; stroke: #3b5272; stroke-width: 1.5; }
      .lifeline { stroke: #3b5272; stroke-width: 1.5; stroke-dasharray: 6 8; }
      .wire { fill: none; stroke: #80ded4; stroke-width: 2; marker-end: url(#arrow); }
      .report { stroke-dasharray: 7 5; }
      .caption { paint-order: stroke; stroke: #0e1829; stroke-width: 8px; stroke-linejoin: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#80ded4" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1120" height="900" rx="24" fill="#0e1829"/>
  <text x="40" y="53" class="title">작업 하나가 진행되는 흐름</text>
  <text x="40" y="84" class="muted">단계 발행 → 위임·수정 → 완료 증거 확인 · 정적 구조 설명이며 실시간 상태가 아닙니다</text>

  <g text-anchor="middle">
    <rect x="45" y="110" width="210" height="62" rx="12" class="node"/>
    <text x="150" y="147" class="name">메인 Codex</text>
    <rect x="300" y="110" width="240" height="62" rx="12" fill="#213c50" stroke="#80ded4" stroke-width="1.5"/>
    <text x="420" y="137" class="name">상주 실행기</text><text x="420" y="161" class="muted">비AI 로컬 프로그램</text>
    <rect x="580" y="110" width="230" height="62" rx="12" class="node"/>
    <text x="695" y="137" class="name">단계별 Moderator</text><text x="695" y="161" class="muted">그룹마다 별도 세션</text>
    <rect x="860" y="110" width="220" height="62" rx="12" class="node"/>
    <text x="970" y="147" class="name">전문 워커</text>
  </g>
  <path d="M150 172V737 M420 172V737 M695 172V737 M970 172V737" class="lifeline"/>

  <text x="285" y="200" text-anchor="middle" class="label caption">단계·참가자·담당 파일</text>
  <text x="285" y="223" text-anchor="middle" class="muted caption">완료 조건 등록</text>
  <path d="M150 237H420" class="wire"/>

  <path d="M420 258H535V290H420" class="wire"/>
  <text x="560" y="269" class="label caption">정원·체크포인트 확인</text>
  <text x="560" y="294" class="muted caption">지정 참가자의 모델·추론 등급 적용</text>

  <text x="557" y="326" text-anchor="middle" class="label caption">Maestro 그룹 시작 · 프롬프트 전달</text>
  <path d="M420 343H695" class="wire"/>

  <text x="832" y="382" text-anchor="middle" class="label caption">담당 범위·계약·완료 조건으로 위임</text>
  <path d="M695 398H970" class="wire"/>

  <text x="832" y="439" text-anchor="middle" class="label caption">변경 파일·확인 결과·미검증 보고</text>
  <path d="M970 455H695" class="wire report"/>

  <text x="832" y="495" text-anchor="middle" class="label caption">필요한 수정·재검증 요청</text>
  <path d="M695 511H970" class="wire"/>

  <text x="832" y="551" text-anchor="middle" class="label caption">수정 결과 보고</text>
  <path d="M970 567H695" class="wire report"/>

  <text x="557" y="607" text-anchor="middle" class="label caption">최종 완료 표식</text>
  <path d="M695 623H420" class="wire report"/>

  <path d="M420 648H535V680H420" class="wire"/>
  <text x="560" y="660" class="label caption">마지막 응답 + 그룹 idle + 필수 파일</text>
  <text x="560" y="685" class="muted caption">현재 요청의 완료 증거 확인</text>

  <text x="557" y="717" text-anchor="middle" class="label caption">다음 등록 단계 시작</text>
  <path d="M420 733H695" class="wire"/>

  <rect x="40" y="762" width="1040" height="111" rx="12" fill="#152e33" stroke="#2d5f61"/>
  <text x="60" y="790" class="name">활동 지도·이력은 별도 관찰</text>
  <text x="60" y="825" class="label">그룹 지시·응답 + 실행기 상태 이벤트</text>
  <path d="M466 819H566" class="wire report"/>
  <text x="590" y="825" class="label">기록을 읽어 지도·이력에 표시</text>
  <text x="60" y="855" class="muted">위임·실행 경로와 구분 · 실선: 작업 전달 / 점선: 결과 보고·관찰</text>
</svg>
