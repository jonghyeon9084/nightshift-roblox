<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc">
  <title id="title">현재 등록된 확장 개발 5단계</title>
  <desc id="desc">첫 버전 5단계 뒤에 연결된 확장 개발 순서다. Integrator와 Planner의 계약과 기획 이후 Profiles, Economy, Delivery, World가 독립 파일 영역에서 병렬 구현한다. Server와 UI의 게임 연결, Review의 독립 검토, Integrator의 수정과 Studio 통합 후 awaiting-review로 결과 검토를 기다린다. 실행 순서이며 실제 완료율이나 테스트 통과를 뜻하지 않는다.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
      .title { fill: #f4f7ff; font-size: 30px; font-weight: 700; }
      .name { fill: #f3f7ff; font-size: 22px; font-weight: 600; }
      .label { fill: #d5e1f2; font-size: 19px; }
      .muted { fill: #adbed8; font-size: 18px; }
      .node { fill: #18263c; stroke: #3b5272; stroke-width: 1.5; }
      .wire { fill: none; stroke: #80ded4; stroke-width: 2; }
      .arrow { marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#80ded4" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1120" height="900" rx="24" fill="#0e1829"/>
  <text x="40" y="53" class="title">현재 등록된 확장 개발 순서</text>
  <text x="40" y="84" class="muted">첫 버전 5단계 뒤에 연결된 확장 5단계 · 실행 순서이며 완료율 표시는 아닙니다</text>

  <rect x="320" y="112" width="480" height="80" rx="14" fill="#213c50" stroke="#80ded4" stroke-width="1.5"/>
  <text x="560" y="145" text-anchor="middle" class="name">1. 확장 계약·재방문 기획</text>
  <text x="560" y="174" text-anchor="middle" class="label">Integrator + Planner</text>
  <path d="M560 192V232" class="wire arrow"/>

  <rect x="40" y="232" width="1040" height="180" rx="16" fill="#152e33" stroke="#2d5f61"/>
  <text x="560" y="264" text-anchor="middle" class="name">2. 서로 다른 파일 영역 · 최대 4명 병렬</text>
  <path d="M560 278V285H179V300 M560 285H433V300 M560 285H687V300 M560 285H941V300" class="wire arrow"/>
  <g text-anchor="middle">
    <rect x="64" y="300" width="230" height="85" rx="12" class="node"/>
    <text x="179" y="335" class="name">Profiles</text><text x="179" y="364" class="label">개인 정보 저장·복원</text>
    <rect x="318" y="300" width="230" height="85" rx="12" class="node"/>
    <text x="433" y="335" class="name">Economy</text><text x="433" y="364" class="label">재고·주문·성장</text>
    <rect x="572" y="300" width="230" height="85" rx="12" class="node"/>
    <text x="687" y="335" class="name">Delivery</text><text x="687" y="364" class="label">배송·운반·도난</text>
    <rect x="826" y="300" width="230" height="85" rx="12" class="node"/>
    <text x="941" y="335" class="name">World</text><text x="941" y="364" class="label">8매장 거리</text>
  </g>
  <path d="M179 385V430H941V385 M433 385V430 M687 385V430" class="wire"/>
  <path d="M560 430V450" class="wire arrow"/>

  <rect x="320" y="450" width="480" height="70" rx="14" class="node"/>
  <text x="560" y="479" text-anchor="middle" class="name">3. 게임 연결·화면</text>
  <text x="560" y="505" text-anchor="middle" class="label">Server + UI 병렬</text>
  <path d="M560 520V555" class="wire arrow"/>

  <rect x="320" y="555" width="480" height="70" rx="14" class="node"/>
  <text x="560" y="584" text-anchor="middle" class="name">4. 독립 코드 검토</text>
  <text x="560" y="610" text-anchor="middle" class="label">Review</text>
  <path d="M560 625V660" class="wire arrow"/>

  <rect x="320" y="660" width="480" height="80" rx="14" class="node"/>
  <text x="560" y="693" text-anchor="middle" class="name">5. 수정·통합·Studio 플레이</text>
  <text x="560" y="722" text-anchor="middle" class="label">Integrator 단독 Studio 쓰기</text>
  <path d="M560 740V775" class="wire arrow"/>

  <rect x="320" y="775" width="480" height="76" rx="14" fill="#213c50" stroke="#80ded4" stroke-width="1.5"/>
  <text x="560" y="806" text-anchor="middle" class="name">등록 단계 종료 · 결과 검토</text>
  <text x="560" y="835" text-anchor="middle" class="label">awaiting-review · completed=false</text>
  <text x="560" y="881" text-anchor="middle" class="muted">단계 종료와 게임 완성·실제 테스트 통과는 구분합니다.</text>
</svg>
